<head>
<meta charset="UTF-8">

<title>英伟达董事会调查发现CEO黄仁勋 meme · 穗澄琉枫</title>
<style>
  :root{
    --bg:#eef0f4; --panel:#fff; --line:#e2e5ea; --ink:#1d2128; --muted:#878d99;
    --accent:#c04a45; --blue:#2b6cf6; --soft:#f5f6f9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .app{display:flex;gap:18px;padding:18px;align-items:flex-start;min-height:100%}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 20px;width:352px;flex:0 0 352px;max-height:calc(100vh - 36px);overflow:auto}
  .panel h1{margin:0 0 2px;font-size:16px;letter-spacing:.3px}
  .panel .sub{margin:0 0 14px;font-size:11.5px;color:var(--muted);line-height:1.6}
  .sect{border:1px solid var(--line);border-radius:10px;padding:10px 10px 12px;margin-bottom:10px;background:var(--soft)}
  .sect>.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .sect>.hd b{font-size:12.5px;font-weight:600}
  .sect>.hd .tag{font-size:10.5px;color:var(--muted);background:#e9ecf2;border-radius:20px;padding:1px 8px}
  .f{margin-bottom:8px}
  .f:last-child{margin-bottom:0}
  .f>label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-family:inherit;font-size:13px;padding:6px 8px;outline:none}
  textarea{resize:vertical;line-height:1.5;min-height:52px}
  textarea:focus,input[type=text]:focus,select:focus{border-color:#b9c7e6}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .inline{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#4a505c}
  input[type=color]{width:100%;height:30px;padding:2px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
  input[type=range]{width:100%}
  .num{display:flex;align-items:center;gap:6px}
  .num output{font-size:11px;color:var(--muted);min-width:26px;text-align:right}
  button{cursor:pointer;border:0;border-radius:8px;font-family:inherit;font-size:12.5px;padding:8px 10px}
  .btn{background:#e9ecf2;color:var(--ink)}
  .btn:hover{background:#dfe3eb}
  .btn.danger{background:#fbeceb;color:var(--accent)}
  .btn.primary{background:var(--blue);color:#fff;width:100%;padding:12px;font-size:14px;font-weight:600;letter-spacing:.5px}
  .btn.primary:hover{background:#1d5be0}
  .drop{border:1px dashed #c8cedb;border-radius:9px;padding:10px;text-align:center;font-size:11.5px;color:var(--muted);background:#fff;cursor:pointer}
  .drop.on{border-color:#9db0d8;color:#42506b}
  .thumbs{display:flex;gap:8px;margin-top:8px}
  .thumb{flex:1;height:64px;border-radius:7px;object-fit:cover;border:1px solid var(--line);display:none}
  .warn{margin-top:8px;font-size:11.5px;line-height:1.5;color:#b26a00;background:#fff6e6;border:1px solid #ffe1b0;border-radius:8px;padding:7px 9px;display:none}
  .stage{flex:1 1 520px;min-width:420px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .canvaswrap{background:#fff;border-radius:14px;padding:10px;border:1px solid var(--line);max-width:100%}
  canvas{display:block;width:100%;max-width:680px;height:auto;border-radius:8px}
  .stage .tip{font-size:11.5px;color:var(--muted)}
  input[type=file]{display:none}
  .chk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#4a505c;margin-top:6px}
  .chk input{margin:0}
  .note{font-size:10.5px;color:var(--muted);line-height:1.55;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
  .sign{margin:12px 0 0;font-size:11px;color:var(--muted);text-align:center;line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
  .sign b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>英伟达董事会调查发现CEO黄仁勋</h1>
    <p class="sub">meme 生成器 · 制作者：<b>穗澄琉枫</b><br>左人像固定，右侧配图可在固定框内缩放/平移；每段文字可单独设字体、字号、颜色。</p>

    <div class="sect">
      <div class="hd"><b>顶部标签</b><span class="tag">红字</span></div>
      <div class="f"><input type="text" id="labelText" value="Tech &amp; AI"></div>
      <div class="grid">
        <div class="f"><label>字号</label><div class="num"><input type="range" id="labelSize" min="12" max="48" value="20"><output id="labelSizeV">20</output></div></div>
        <div class="f"><label>颜色</label><input type="color" id="labelColor" value="#c04a45"></div>
      </div>
    </div>

    <div class="sect">
      <div class="hd"><b>主标题</b><span class="tag">粗体</span></div>
      <div class="f"><textarea id="titleText" placeholder="输入新闻标题，自动换行"></textarea></div>
      <div class="f"><label>字体</label>
        <select id="titleFont">
          <option value='"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif'>微软雅黑（黑体）</option>
          <option value='"SimHei","Heiti SC",sans-serif'>中易黑体</option>
          <option value='"Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif'>思源黑体</option>
          <option value='Georgia,"Times New Roman","Songti SC",serif'>Georgia（西文衬线）</option>
          <option value='"SimSun","Songti SC",serif'>宋体</option>
          <option value='Impact,"Arial Black",sans-serif'>Impact（超粗标题）</option>
          <option value='Arial,Helvetica,sans-serif'>Arial</option>
        </select>
      </div>
      <div class="grid3">
        <div class="f"><label>字号</label><div class="num"><input type="range" id="titleSize" min="24" max="96" value="56"><output id="titleSizeV">56</output></div></div>
        <div class="f"><label>行距</label><div class="num"><input type="range" id="titleLH" min="90" max="180" value="113"><output id="titleLHV">1.13</output></div></div>
        <div class="f"><label>颜色</label><input type="color" id="titleColor" value="#101010"></div>
      </div>
      <label class="chk"><input type="checkbox" id="titleBold" checked> 加粗</label>
    </div>

    <div class="sect">
      <div class="hd"><b>正文 / 引用</b><span class="tag">可与标题不同字体</span></div>
      <div class="f"><textarea id="bodyText" placeholder="输入正文或引语"></textarea></div>
      <div class="f"><label>字体</label>
        <select id="bodyFont">
          <option value='Georgia,"Times New Roman","Songti SC",serif'>Georgia（西文衬线）</option>
          <option value='"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif'>思源宋体</option>
          <option value='"SimSun","Songti SC",serif'>宋体</option>
          <option value='"KaiTi","STKaiti",serif'>楷体</option>
          <option value='"Microsoft YaHei","PingFang SC",Arial,sans-serif'>微软雅黑（黑体）</option>
          <option value='Arial,Helvetica,sans-serif'>Arial</option>
        </select>
      </div>
      <div class="grid3">
        <div class="f"><label>字号</label><div class="num"><input type="range" id="bodySize" min="16" max="60" value="33"><output id="bodySizeV">33</output></div></div>
        <div class="f"><label>行距</label><div class="num"><input type="range" id="bodyLH" min="100" max="220" value="142"><output id="bodyLHV">1.42</output></div></div>
        <div class="f"><label>颜色</label><input type="color" id="bodyColor" value="#1b1b1b"></div>
      </div>
      <label class="chk"><input type="checkbox" id="bodyItalic"> 斜体</label>
      <label class="chk"><input type="checkbox" id="bodyBold"> 加粗</label>
      <label class="chk"><input type="checkbox" id="bodyFit" checked> 自动缩放字号以适配固定文字区</label>
      <div class="note" id="bodyFitInfo"></div>
    </div>

    <div class="sect">
      <div class="hd"><b>日期</b><span class="tag">左下</span></div>
      <div class="f"><input type="text" id="dateText" value="November 23, 2026"></div>
      <label class="chk"><input type="checkbox" id="dateAuto" checked> 自动同步为当天日期（November 23, 2026 格式）</label>
      <div class="grid">
        <div class="f"><label>字号</label><div class="num"><input type="range" id="dateSize" min="12" max="48" value="24"><output id="dateSizeV">24</output></div></div>
        <div class="f"><label>颜色</label><input type="color" id="dateColor" value="#222831"></div>
      </div>
      <label class="chk"><input type="checkbox" id="dateBold" checked> 加粗</label>
    </div>

    <div class="sect">
      <div class="hd"><b>图片</b></div>
      <div class="f">
        <label>左侧人像 · 固定素材（不可修改）</label>
        <img class="thumb" id="leftThumb" style="display:block;height:70px">
      </div>
      <div class="f">
        <label>右侧配图 · 可更换（固定框内可调）</label>
        <div class="drop" id="rightDrop">点击上传图片 / 拖入</div>
        <input type="file" id="rightFile" accept="image/*">
        <img class="thumb" id="rightThumb">
      </div>
      <div class="f"><label>框内缩放</label><div class="num"><input type="range" id="rightZoom" min="100" max="400" value="100"><output id="rightZoomV">100%</output></div></div>
      <div class="grid">
        <div class="f"><label>左右平移</label><div class="num"><input type="range" id="rightX" min="-50" max="50" value="0"><output id="rightXV">0</output></div></div>
        <div class="f"><label>上下平移</label><div class="num"><input type="range" id="rightY" min="-50" max="50" value="0"><output id="rightYV">0</output></div></div>
      </div>
      <button class="btn" id="rightReset" style="width:100%;margin-bottom:8px">重置框内位置与缩放</button>
      <button class="btn danger" id="rightClear" style="width:100%">移除右侧配图</button>
    </div>

    <button class="btn primary" id="exportBtn">导出 PNG（2 倍高清）</button>
    <div class="warn" id="warn"></div>
    <p class="sign">英伟达董事会调查发现CEO黄仁勋 meme ｜ 制作者：<b>穗澄琉枫</b></p>
  </aside>

  <main class="stage">
    <div class="canvaswrap"><canvas id="cv" width="1200" height="1030"></canvas></div>
    <div class="tip">左人像固定；右图可在框内拖动／滚轮缩放；正文按固定文字区自动适配字号。</div>
  </main>
</div>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const fixedImg = new Image();

fixedImg.onload = () => { fixedReady = true; render(); };
fixedImg.src = FIXED_PORTRAIT_SRC;

/* ============ 元素引用 ============ */
const el = id => document.getElementById(id);
const labelText = el('labelText'), labelSize = el('labelSize'), labelColor = el('labelColor'), labelSizeV = el('labelSizeV');
const titleText = el('titleText'), titleSize = el('titleSize'), titleSizeV = el('titleSizeV'),
      titleLH = el('titleLH'), titleLHV = el('titleLHV'), titleColor = el('titleColor'),
      titleFont = el('titleFont'), titleBold = el('titleBold');
const bodyText = el('bodyText'), bodySize = el('bodySize'), bodySizeV = el('bodySizeV'),
      bodyLH = el('bodyLH'), bodyLHV = el('bodyLHV'), bodyColor = el('bodyColor'),
      bodyFont = el('bodyFont'), bodyItalic = el('bodyItalic'), bodyBold = el('bodyBold');
const dateText = el('dateText'), dateSize = el('dateSize'), dateSizeV = el('dateSizeV'),
      dateColor = el('dateColor'), dateBold = el('dateBold'), dateAuto = el('dateAuto');
const bodyFit = el('bodyFit'), bodyFitInfo = el('bodyFitInfo');
const rightZoom = el('rightZoom'), rightZoomV = el('rightZoomV'),
      rightX = el('rightX'), rightXV = el('rightXV'),
      rightY = el('rightY'), rightYV = el('rightYV');
const warnBox = el('warn');

/* ============ 日期自动同步 ============ */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function todayEN(){
  const d = new Date();
  return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}
function syncDate(){
  if (dateAuto.checked) {
    dateText.value = todayEN();
    dateText.readOnly = true;
    dateText.style.background = '#f2f4f8';
    dateText.style.color = '#6d7480';
  } else {
    dateText.readOnly = false;
    dateText.style.background = '#fff';
    dateText.style.color = '';
  }
}

/* ============ 排版工具 ============ */
const CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFFEF\u3000-\u303F]/;

function isCJK(ch){ return CJK.test(ch); }

function tokenize(text){
  const out = [];
  let buf = '';
  for (const ch of text){
    if (ch === '\n'){ if (buf){ out.push(buf); buf = ''; } out.push('\n'); continue; }
    if (isCJK(ch) || ch === ' '){
      if (buf){ out.push(buf); buf = ''; }
      out.push(ch);
    } else {
      buf += ch;
    }
  }
  if (buf) out.push(buf);
  return out;
}

function wrapTokens(tokens, maxW, font){
  ctx.font = font;
  const lines = [[]];
  let cur = 0;
  for (const t of tokens){
    if (t === '\n'){ lines.push([]); cur = 0; continue; }
    const w = ctx.measureText(t).width;
    if (cur + w > maxW && cur > 0){
      if (t === ' '){ continue; }
      lines.push([]);
      cur = 0;
    }
    lines[lines.length - 1].push({ t, w });
    cur += w;
  }
  return lines.filter(l => l.length);
}

function drawLines(lines, x, yTop, lineH, color){
  ctx.fillStyle = color;
  let y = yTop;
  for (const line of lines){
    let cx = x;
    for (const tk of line){
      ctx.fillText(tk.t, cx, y);
      cx += tk.w;
    }
    y += lineH;
  }
  return y;
}

function fontOf(size, family, bold, italic){
  return (italic ? 'italic ' : '') + (bold ? '700 ' : '400 ') + size + 'px ' + family;
}

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawCover(c, img, box, radius){
  const ir = img.width / img.height, br = box.w / box.h;
  let sw, sh, sx, sy;
  if (ir > br){ sh = img.height; sw = sh * br; sx = (img.width - sw) / 2; sy = 0; }
  else { sw = img.width; sh = sw / br; sx = 0; sy = (img.height - sh) / 2; }
  c.save();
  roundRect(c, box.x, box.y, box.w, box.h, radius);
  c.clip();
  c.drawImage(img, sx, sy, sw, sh, box.x, box.y, box.w, box.h);
  c.restore();
}

/* 右侧配图：固定框内可缩放 / 平移 */
function drawRightImage(c, box, radius){
  if (!rightImg) return;
  const base = Math.max(box.w / rightImg.width, box.h / rightImg.height);
  const sc = base * (+rightZoom.value / 100);
  const dw = rightImg.width * sc, dh = rightImg.height * sc;
  const cx = box.x + box.w / 2 + (+rightX.value) / 100 * box.w;
  const cy = box.y + box.h / 2 + (+rightY.value) / 100 * box.h;
  c.save();
  roundRect(c, box.x, box.y, box.w, box.h, radius);
  c.clip();
  c.drawImage(rightImg, cx - dw / 2, cy - dh / 2, dw, dh);
  c.restore();
}

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* ============ 主渲染 ============ */
function render(){
  renderTo(ctx, 1, false);
}

function renderTo(c, scale, exporting){
  const s = scale;
  c.save();
  c.scale(s, s);

  // 黑底 + 白卡片
  c.fillStyle = '#0a0a0a';
  c.fillRect(0, 0, W, H);
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.35)';
  c.shadowBlur = 22;
  c.shadowOffsetY = 6;
  c.fillStyle = '#ffffff';
  roundRect(c, CARD.x, CARD.y, CARD.w, CARD.h, CARD.r);
  c.fill();
  c.restore();

  c.textAlign = 'left';
  c.textBaseline = 'top';

  /* --- 顶部标签 --- */
  const lSize = +labelSize.value;
  c.font = fontOf(lSize, '"Microsoft YaHei","PingFang SC",Arial,sans-serif', true, false);
  c.fillStyle = labelColor.value;
  c.fillText(labelText.value || '', TEXT_L, 24);

  /* --- 文字区：标题 + 正文，固定在「标签下 → 日期上」的区域内 --- */
  const dSize = +dateSize.value;
  const dTop = PHOTO_TOP - 34 - dSize * 1.3;
  const zoneTop = 24 + lSize * 1.5 + 12;
  const zoneBottom = dTop - 16;
  const zoneH = Math.max(20, zoneBottom - zoneTop);

  const tText = titleText.value.trim();
  const bText = bodyText.value.trim();
  const tBase = +titleSize.value;
  const bBase = +bodySize.value;

  function measureTextZone(k){
    const tS = tBase * k, bS = bBase * k;
    const tF = fontOf(tS, titleFont.value, titleBold.checked, false);
    const tLh = tS * (+titleLH.value / 100);
    const tLines = tText ? wrapTokens(tokenize(tText), TEXT_W, tF) : [];
    const tBlock = tLines.length ? tLines.length * tLh : tS * 1.05;
    const gap = tS * 0.55;
    const bF = fontOf(bS, bodyFont.value, bodyBold.checked, bodyItalic.checked);
    const bLh = bS * (+bodyLH.value / 100);
    const bLines = bText ? wrapTokens(tokenize(bText), TEXT_W, bF) : [];
    const bBlock = bLines.length ? bLines.length * bLh : bS * 1.15;
    return { tS, bS, tF, tLh, tLines, tBlock, gap, bF, bLh, bLines, bBlock,
             total: tBlock + gap + bBlock };
  }

  let M = measureTextZone(1);
  if (bodyFit.checked){
    let k = 1;
    while (M.total > zoneH && k > 0.45){ k -= 0.02; M = measureTextZone(k); }
  }

  bodyFitInfo.textContent = '文字区固定高度 ' + Math.round(zoneH) + 'px ｜ 当前占用 ' +
    Math.round(M.total) + 'px ｜ 生效字号：标题 ' + Math.round(M.tS) + 'px / 正文 ' +
    Math.round(M.bS) + 'px' + (bodyFit.checked ? '（自动适配已开）' : '');

  /* 标题 */
  let y;
  if (M.tLines.length){
    c.font = M.tF;
    y = drawLines(M.tLines, TEXT_L, zoneTop, M.tLh, titleColor.value);
  } else {
    if (!exporting){
      c.font = M.tF;
      c.fillStyle = 'rgba(20,24,32,0.16)';
      c.fillText('标题示例文字', TEXT_L, zoneTop);
    }
    y = zoneTop + M.tBlock;
  }

  /* 正文 */
  const bodyTop = y + M.gap;
  let bodyBottom;
  if (M.bLines.length){
    c.font = M.bF;
    bodyBottom = drawLines(M.bLines, TEXT_L, bodyTop, M.bLh, bodyColor.value) - M.bLh + M.bS * 1.15;
  } else {
    bodyBottom = bodyTop + M.bS * 1.15;
    if (!exporting){
      c.font = M.bF;
      c.fillStyle = 'rgba(20,24,32,0.13)';
      c.fillText('正文或引语示例文字，自动换行排布。', TEXT_L, bodyTop);
    }
  }

  /* --- 日期（锚定在图片区上方） --- */
  c.font = fontOf(dSize, '"Microsoft YaHei","PingFang SC",Arial,sans-serif', dateBold.checked, false);
  c.fillStyle = dateColor.value;
  c.fillText(dateText.value || '', TEXT_L, dTop);

  /* --- 图片区 --- */
  if (fixedReady) drawCover(c, fixedImg, LEFT_RECT, 4);
  else {
    c.fillStyle = '#f1f2f5';
    c.fillRect(LEFT_RECT.x, LEFT_RECT.y, LEFT_RECT.w, LEFT_RECT.h);
  }

  if (rightImg){
    drawRightImage(c, RIGHT_RECT, 4);
  } else if (!exporting){
    c.save();
    c.fillStyle = '#f5f6f9';
    c.fillRect(RIGHT_RECT.x, RIGHT_RECT.y, RIGHT_RECT.w, RIGHT_RECT.h);
    c.strokeStyle = '#c6ccd8';
    c.setLineDash([10, 8]);
    c.lineWidth = 2;
    c.strokeRect(RIGHT_RECT.x + 1, RIGHT_RECT.y + 1, RIGHT_RECT.w - 2, RIGHT_RECT.h - 2);
    c.setLineDash([]);
    c.fillStyle = '#9aa1ad';
    c.textAlign = 'center';
    c.font = '26px "Microsoft YaHei",Arial,sans-serif';
    c.fillText('右侧配图', RIGHT_RECT.x + RIGHT_RECT.w / 2, RIGHT_RECT.y + RIGHT_RECT.h / 2 - 34);
    c.font = '20px "Microsoft YaHei",Arial,sans-serif';
    c.fillText('点击左侧上传', RIGHT_RECT.x + RIGHT_RECT.w / 2, RIGHT_RECT.y + RIGHT_RECT.h / 2 + 4);
    c.textAlign = 'left';
    c.restore();
  }

  c.restore();

  /* --- 溢出提示 --- */
  if (M.total > zoneH + 1){
    warnBox.style.display = 'block';
    warnBox.textContent = '文字超出固定文字区（占用 ' + Math.round(M.total) + 'px / 可用 ' +
      Math.round(zoneH) + 'px）。已缩到最小仍放不下，请精简文字或调小字号。';
  } else {
    warnBox.style.display = 'none';
  }
}

/* ============ 事件绑定 ============ */
function bind(){
  // 滑块数值实时回显
  const mirrors = { labelSize:'labelSizeV', titleSize:'titleSizeV', bodySize:'bodySizeV', dateSize:'dateSizeV' };
  Object.keys(mirrors).forEach(id => {
    el(id).addEventListener('input', () => { el(mirrors[id]).textContent = el(id).value; });
  });
  [['titleLH','titleLHV'], ['bodyLH','bodyLHV']].forEach(([id, outId]) => {
    el(id).addEventListener('input', () => { el(outId).textContent = (+el(id).value / 100).toFixed(2); });
  });

  const all = ['labelText','labelSize','labelColor','titleText','titleSize','titleLH','titleColor','titleFont','titleBold',
               'bodyText','bodySize','bodyLH','bodyColor','bodyFont','bodyItalic','bodyBold','bodyFit',
               'dateText','dateSize','dateColor','dateBold'];
  all.forEach(id => {
    el(id).addEventListener('input', () => {
      if (dateAuto.checked) syncDate();
      render();
    });
  });
  dateAuto.addEventListener('change', () => { syncDate(); render(); });

  // 右侧配图：固定框内缩放 / 平移
  rightZoom.addEventListener('input', () => { rightZoomV.textContent = rightZoom.value + '%'; render(); });
  rightX.addEventListener('input', () => { rightXV.textContent = rightX.value; render(); });
  rightY.addEventListener('input', () => { rightYV.textContent = rightY.value; render(); });
  el('rightReset').addEventListener('click', resetRight);
}

function resetRight(){
  rightZoom.value = 100; rightX.value = 0; rightY.value = 0;
  rightZoomV.textContent = '100%'; rightXV.textContent = '0'; rightYV.textContent = '0';
  render();
}

/* 上传右侧配图 */
const rightDrop = el('rightDrop'), rightFile = el('rightFile'), rightThumb = el('rightThumb');
rightDrop.addEventListener('click', () => rightFile.click());
rightDrop.addEventListener('dragover', e => { e.preventDefault(); rightDrop.classList.add('on'); });
rightDrop.addEventListener('dragleave', () => rightDrop.classList.remove('on'));
rightDrop.addEventListener('drop', e => {
  e.preventDefault();
  rightDrop.classList.remove('on');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadRight(f);
});
rightFile.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadRight(f);
});
function loadRight(file){
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    rightImg = im;
    rightThumb.src = url;
    rightThumb.style.display = 'block';
    rightDrop.textContent = '已上传：' + file.name + '（点击可更换）';
    rightZoom.value = 100; rightX.value = 0; rightY.value = 0;
    rightZoomV.textContent = '100%'; rightXV.textContent = '0'; rightYV.textContent = '0';
    cv.style.cursor = 'grab';
    render();
  };
  im.src = url;
}
el('rightClear').addEventListener('click', () => {
  rightImg = null;
  rightFile.value = '';
  rightThumb.style.display = 'none';
  rightThumb.removeAttribute('src');
  rightDrop.textContent = '点击上传图片 / 拖入';
  cv.style.cursor = 'default';
  render();
});

/* 在预览里直接拖右图微调位置 */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function inRightBox(p){
  return p.x >= RIGHT_RECT.x && p.x <= RIGHT_RECT.x + RIGHT_RECT.w &&
         p.y >= RIGHT_RECT.y && p.y <= RIGHT_RECT.y + RIGHT_RECT.h;
}
let dragging = false, dragStart = null;
cv.addEventListener('pointerdown', e => {
  if (!rightImg) return;
  const p = canvasPos(e);
  if (!inRightBox(p)) return;
  e.preventDefault();
  dragging = true;
  dragStart = { px: p.x, py: p.y, x: +rightX.value, y: +rightY.value };
  cv.setPointerCapture(e.pointerId);
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', e => {
  if (!rightImg) return;
  const p = canvasPos(e);
  if (!dragging){
    cv.style.cursor = inRightBox(p) ? 'grab' : 'default';
    return;
  }
  rightX.value = clamp(dragStart.x + (p.x - dragStart.px) / RIGHT_RECT.w * 100, -50, 50);
  rightY.value = clamp(dragStart.y + (p.y - dragStart.py) / RIGHT_RECT.h * 100, -50, 50);
  rightXV.textContent = Math.round(rightX.value);
  rightYV.textContent = Math.round(rightY.value);
  render();
});
cv.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  cv.style.cursor = 'grab';
  try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointercancel', () => { dragging = false; });

/* 滚轮在右图区域缩放 */
cv.addEventListener('wheel', e => {
  if (!rightImg) return;
  const p = canvasPos(e);
  if (!inRightBox(p)) return;
  e.preventDefault();
  const step = e.deltaY < 0 ? 5 : -5;
  rightZoom.value = clamp(+rightZoom.value + step, 100, 400);
  rightZoomV.textContent = rightZoom.value + '%';
  render();
}, { passive: false });

/* 导出 */
el('exportBtn').addEventListener('click', () => {
  if (dateAuto.checked) syncDate();
  const scale = 2;
  const off = document.createElement('canvas');
  off.width = W * scale;
  off.height = H * scale;
  const octx = off.getContext('2d');
  renderTo(octx, scale, true);
  off.toBlob(blob => {
    const a = document.createElement('a');
    a.download = '英伟达董事会调查发现CEO黄仁勋meme-' + todayEN().replace(/[ ,]+/g, '-') + '.png';
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});

/* 初始化 */
el('leftThumb').src = FIXED_PORTRAIT_SRC;
syncDate();
bind();
render();
</script>
